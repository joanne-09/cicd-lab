name: CI 112062309

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read
  checks: write
  actions: read

concurrency:
  group: ci-112062309-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, Format, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Prettier check
        run: npm run format:check

      - name: Run tests with JUnit report
        run: |
          mkdir -p reports
          npm run test:ci

      - name: Publish test results
        if: ${{ always() && hashFiles('reports/vitest-junit.xml') != '' }}
        uses: dorny/test-reporter@v2
        with:
          name: Vitest Test Results
          path: reports/vitest-junit.xml
          reporter: java-junit
          fail-on-error: true
          fail-on-empty: true

      - name: Upload test report artifact
        if: ${{ always() && hashFiles('reports/vitest-junit.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit-report
          path: reports/vitest-junit.xml
          if-no-files-found: error
